<!DOCTYPE html>
<html>
<head><title>Generate CodeGuru Icons</title></head>
<body>
<p>Right-click each canvas and "Save image as" to get the PNG icons.</p>
<h3>16x16</h3><canvas id="c16" width="16" height="16"></canvas>
<h3>48x48</h3><canvas id="c48" width="48" height="48"></canvas>
<h3>128x128</h3><canvas id="c128" width="128" height="128"></canvas>
<script>
function drawIcon(canvas) {
  const s = canvas.width;
  const ctx = canvas.getContext('2d');
  // Background gradient
  const grad = ctx.createLinearGradient(0, 0, s, s);
  grad.addColorStop(0, '#7C3AED');
  grad.addColorStop(1, '#06B6D4');
  // Rounded rect
  const r = s * 0.2;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(s - r, 0);
  ctx.quadraticCurveTo(s, 0, s, r);
  ctx.lineTo(s, s - r);
  ctx.quadraticCurveTo(s, s, s - r, s);
  ctx.lineTo(r, s);
  ctx.quadraticCurveTo(0, s, 0, s - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();
  // Code brackets "{ }"
  ctx.fillStyle = 'white';
  ctx.font = `bold ${s * 0.45}px monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('{ }', s / 2, s / 2);
}
drawIcon(document.getElementById('c16'));
drawIcon(document.getElementById('c48'));
drawIcon(document.getElementById('c128'));
</script>
</body>
</html>
